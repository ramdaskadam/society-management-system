@if (isOpen) {
  <div class="modal-backdrop">
    <div class="app-dialog modal-card" role="dialog" aria-modal="true" aria-labelledby="register-member-title">
      <div class="dialog-header">
        <h3 id="register-member-title" class="dialog-title">Register New Society Member</h3>
        <button type="button" class="dialog-close-btn" aria-label="Close" (click)="close.emit()">✕</button>
      </div>
      <div class="dialog-body">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="mem-first-name">First Name *</label>
            <input
              id="mem-first-name"
              type="text"
              class="form-control"
              [(ngModel)]="firstName"
              placeholder="e.g. Arvind"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="mem-middle-name">Middle Name</label>
            <input
              id="mem-middle-name"
              type="text"
              class="form-control"
              [(ngModel)]="middleName"
              placeholder="e.g. Ramesh"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="mem-last-name">Last Name *</label>
            <input
              id="mem-last-name"
              type="text"
              class="form-control"
              [(ngModel)]="lastName"
              placeholder="e.g. Mehta"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="mem-gender">Gender *</label>
            <select id="mem-gender" class="form-control" [(ngModel)]="gender">
              <option value="" disabled>Select gender…</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="mem-dob">
              Date of Birth <span class="auth-optional">(Optional)</span>
            </label>
            <input
              id="mem-dob"
              type="date"
              class="form-control"
              [(ngModel)]="dob"
              [max]="todayIso"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="mem-role">Role</label>
            <select id="mem-role" class="form-control" [(ngModel)]="role">
              <option value="Owner">Flat Owner</option>
              <option value="Tenant">Registered Tenant</option>
              <option value="Committee Member">Committee Member</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="mem-phone">Phone Number *</label>
            <input
              id="mem-phone"
              type="tel"
              class="form-control"
              [(ngModel)]="phone"
              placeholder="+91 98XXX XXXXX"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="mem-email">Email Address *</label>
            <input
              id="mem-email"
              type="email"
              class="form-control"
              [(ngModel)]="email"
              placeholder="member@example.com"
            />
          </div>
        </div>

        @if (formError()) {
          <div class="auth-error" role="alert"><span aria-hidden="true">⚠</span> {{ formError() }}</div>
        }
      </div>
      <div class="dialog-footer">
        <button type="button" class="btn-secondary" (click)="close.emit()">Cancel</button>
        <button type="button" class="btn-primary" (click)="submitMember()">Add Member</button>
      </div>
    </div>
  </div>
}
