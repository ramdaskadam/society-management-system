<div class="page-header">
      <div class="page-title-group">
        <h1>Society Configuration & Settings</h1>
        <p>Society rules, billing parameters, registration certificate details</p>
      </div>
    </div>

    <div class="dash-card" style="max-width: 720px;">
      <div class="form-group">
        <label class="form-label">Society Name</label>
        <input type="text" class="form-control" [value]="society.fullName" readonly />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Registration Number</label>
          <input type="text" class="form-control" [value]="society.regNo" readonly />
        </div>
        <div class="form-group">
          <label class="form-label">Total Units</label>
          <input type="text" class="form-control" [value]="society.totalUnits + ' Units (4 Wings)'" readonly />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Registered Office Address</label>
        <input type="text" class="form-control" [value]="society.address" readonly />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Base Maintenance Charge Rate</label>
          <input type="text" class="form-control" [value]="'₹ ' + society.maintenancePerSqFt + ' / sq.ft / month'" />
        </div>
        <div class="form-group">
          <label class="form-label">Late Payment Interest Rate</label>
          <input type="text" class="form-control" [value]="society.lateFeePercentage + '% per annum'" />
        </div>
      </div>
    </div>
