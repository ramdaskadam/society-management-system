<div class="page-header">
  <div class="page-title-group">
    <h1>Units &amp; Apartment Registry</h1>
    <p>Wings {{ wingSummary() }}, occupancy records, and square footage details</p>
  </div>
  <div class="page-header-actions">
    <button type="button" class="btn-secondary" (click)="viewTenantHistory()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      {{ 'tenant.viewHistory' | t }} ({{ state.activeUnitTenants().length }})
    </button>
    @if (state.currentUserRole() === 'admin') {
      <button type="button" class="btn-primary" (click)="openAddUnit()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Add Unit
      </button>
    }
  </div>
</div>

<div class="dash-card">
  <app-data-table
    [columns]="columns"
    [rows]="visibleUnits()"
    [loading]="state.isLoading()"
    emptyMessage="No units found"
  />
</div>
