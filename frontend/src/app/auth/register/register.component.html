<main class="auth-page">
  <section class="auth-card" aria-labelledby="register-title">
    <div class="auth-brand">
      <div class="society-brand-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <div>
        <div class="auth-brand-name">Green Meadows</div>
        <div class="auth-brand-sub">Society Management</div>
      </div>
    </div>

    <h1 id="register-title" class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Register as a resident. Your society admin controls what you can access.</p>

    <form (ngSubmit)="submit()" novalidate>
      <div class="form-group">
        <label class="form-label" for="reg-name">Full name</label>
        <input id="reg-name" name="fullName" type="text" class="form-control auth-input" [(ngModel)]="fullName" autocomplete="name" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Email</label>
        <input id="reg-email" name="email" type="email" inputmode="email" class="form-control auth-input" [(ngModel)]="email" autocomplete="email" autocapitalize="off" spellcheck="false" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-username">Username</label>
        <input id="reg-username" name="username" type="text" class="form-control auth-input" [(ngModel)]="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input id="reg-password" name="password" type="password" class="form-control auth-input" [(ngModel)]="password" autocomplete="new-password" minlength="4" aria-describedby="reg-password-help" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-confirm">Confirm password</label>
          <input id="reg-confirm" name="confirmPassword" type="password" class="form-control auth-input" [(ngModel)]="confirmPassword" autocomplete="new-password" required />
        </div>
      </div>
      <p id="reg-password-help" class="auth-help">At least 4 characters (demo build).</p>

      @if (error()) {
        <div class="auth-error" role="alert"><span aria-hidden="true">⚠</span> {{ error() }}</div>
      }

      <button type="submit" class="btn-primary auth-submit">Create account</button>
    </form>

    <p class="auth-footer">
      Already registered?
      <a routerLink="/login" class="auth-link">Sign in</a>
    </p>
  </section>
</main>
