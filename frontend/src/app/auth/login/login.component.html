<main class="auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <div class="auth-brand">
      <div class="society-brand-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <div>
        <div class="auth-brand-name">{{ society().name }}</div>
        <div class="auth-brand-sub">Society Management</div>
      </div>
    </div>

    <h1 id="login-title" class="auth-title">Sign in</h1>
    <p class="auth-subtitle">Welcome back. Enter your email or mobile number to continue.</p>

    <div class="auth-demo-hint">
      <span>Demo account: <strong>demo</strong> / <strong>demo</strong></span>
      <button type="button" class="auth-link-btn" (click)="useDemo()">Fill demo credentials</button>
    </div>

    <form (ngSubmit)="submit()" novalidate>
      <div class="form-group">
        <label class="form-label" for="login-username">Email or mobile number</label>
        <input
          id="login-username"
          name="username"
          type="text"
          class="form-control auth-input"
          [(ngModel)]="username"
          autocomplete="username"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          required
          [attr.aria-describedby]="error() ? 'login-error' : null"
        />
      </div>

      <div class="form-group">
        <div class="auth-label-row">
          <label class="form-label" for="login-password">Password</label>
          <a routerLink="/forgot-password" class="auth-link">Forgot password?</a>
        </div>
        <div class="auth-password-wrap">
        <input
          id="login-password"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          class="form-control auth-input"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
          [attr.aria-describedby]="error() ? 'login-error' : null"
        />
        <button type="button" class="auth-link-btn auth-toggle" (click)="togglePassword()" [attr.aria-pressed]="showPassword()">
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
        </div>
      </div>

      @if (error()) {
        <div id="login-error" class="auth-error" role="alert">
          <span aria-hidden="true">⚠</span> {{ error() }}
        </div>
      }

      <button type="submit" class="btn-primary auth-submit">Sign in</button>
    </form>

    <div class="auth-divider"><span>or continue with</span></div>

    @if (socialProvider(); as provider) {
      <!-- Simulated consent step (mock mode only) -->
      <form class="auth-social-step" (ngSubmit)="confirmSocial()" novalidate>
        <label class="form-label" for="social-email">
          {{ provider === 'google' ? 'Gmail address' : 'Facebook account email' }}
        </label>
        <input id="social-email" name="socialEmail" type="email" inputmode="email" class="form-control auth-input"
          [(ngModel)]="socialEmail" autocomplete="email" autocapitalize="off" spellcheck="false" required />
        <div class="auth-social-actions">
          <button type="submit" class="btn-primary">Continue with {{ provider === 'google' ? 'Google' : 'Facebook' }}</button>
          <button type="button" class="btn-secondary" (click)="cancelSocial()">Cancel</button>
        </div>
      </form>
    } @else {
      <div class="auth-social">
        <button type="button" class="btn-secondary auth-social-btn" (click)="startSocial('google')">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.4-1.7 4.1-5.5 4.1a6.2 6.2 0 0 1 0-12.4c2 0 3.3.9 4 1.6l2.7-2.6A9.8 9.8 0 0 0 12 2a10 10 0 1 0 0 20c5.8 0 9.6-4 9.6-9.8 0-.7-.1-1.2-.2-2z"/></svg>
          Gmail
        </button>
        <button type="button" class="btn-secondary auth-social-btn" (click)="startSocial('facebook')">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>
          Facebook
        </button>
      </div>
    }

    <p class="auth-footer">
      New here?
      <a routerLink="/register" class="auth-link">Create an account</a>
    </p>
  </section>
</main>
