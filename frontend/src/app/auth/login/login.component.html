<main class="auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <div class="auth-brand">
      <div class="society-brand-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <div>
        <div class="auth-brand-name">Green Meadows</div>
        <div class="auth-brand-sub">Society Management</div>
      </div>
    </div>

    <h1 id="login-title" class="auth-title">Sign in</h1>
    <p class="auth-subtitle">Welcome back. Enter your credentials to continue.</p>

    <div class="auth-demo-hint">
      <span>Demo account: <strong>demo</strong> / <strong>demo</strong></span>
      <button type="button" class="auth-link-btn" (click)="useDemo()">Fill demo credentials</button>
    </div>

    <form (ngSubmit)="submit()" novalidate>
      <div class="form-group">
        <label class="form-label" for="login-username">Username</label>
        <input
          id="login-username"
          name="username"
          type="text"
          class="form-control auth-input"
          [(ngModel)]="username"
          autocomplete="username"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          required
          [attr.aria-describedby]="error() ? 'login-error' : null"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input
          id="login-password"
          name="password"
          type="password"
          class="form-control auth-input"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
          [attr.aria-describedby]="error() ? 'login-error' : null"
        />
      </div>

      @if (error()) {
        <div id="login-error" class="auth-error" role="alert">
          <span aria-hidden="true">⚠</span> {{ error() }}
        </div>
      }

      <button type="submit" class="btn-primary auth-submit">Sign in</button>
    </form>

    <p class="auth-footer">
      New to Green Meadows?
      <a routerLink="/register" class="auth-link">Create an account</a>
    </p>
  </section>
</main>
