<main class="auth-page">
  <section class="auth-card" aria-labelledby="forgot-title">
    <h1 id="forgot-title" class="auth-title">Reset your password</h1>

    @if (step() === 'identify') {
      <p class="auth-subtitle">Enter your username or email and we'll show your hint question.</p>
      <form (ngSubmit)="findAccount()" novalidate>
        <div class="form-group">
          <label class="form-label" for="fp-id">Email or mobile number</label>
          <input id="fp-id" name="identifier" type="text" class="form-control auth-input" [(ngModel)]="identifier"
            autocomplete="username" autocapitalize="off" spellcheck="false" required />
        </div>
        @if (error()) {
          <div class="auth-error" role="alert"><span aria-hidden="true">⚠</span> {{ error() }}</div>
        }
        <button type="submit" class="btn-primary auth-submit">Continue</button>
      </form>
    } @else {
      <p class="auth-subtitle">Answer your hint question to choose a new password.</p>
      <form (ngSubmit)="resetPassword()" novalidate>
        <div class="form-group">
          <label class="form-label" for="fp-answer">{{ question() }}</label>
          <input id="fp-answer" name="answer" type="text" class="form-control auth-input" [(ngModel)]="answer" autocomplete="off" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="fp-new">New password</label>
            <input id="fp-new" name="newPassword" type="password" class="form-control auth-input" [(ngModel)]="newPassword" autocomplete="new-password" minlength="10" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="fp-confirm">Confirm password</label>
            <input id="fp-confirm" name="confirmPassword" type="password" class="form-control auth-input" [(ngModel)]="confirmPassword" autocomplete="new-password" required />
          </div>
        </div>
        <app-password-checklist [password]="newPassword" [personal]="[identifier]" />
        @if (error()) {
          <div class="auth-error" role="alert"><span aria-hidden="true">⚠</span> {{ error() }}</div>
        }
        <button type="submit" class="btn-primary auth-submit">Update password</button>
        <button type="button" class="auth-link-btn" (click)="back()">Use a different account</button>
      </form>
    }

    <p class="auth-footer"><a routerLink="/login" class="auth-link">Back to sign in</a></p>
  </section>
</main>
