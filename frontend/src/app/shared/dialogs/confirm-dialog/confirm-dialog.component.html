@if (isOpen()) {
  <div class="modal-backdrop" (click)="cancel.emit()">
    <div
      class="app-dialog modal-card confirm-dialog-card"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-dlg-title"
      aria-describedby="confirm-dlg-desc"
      (click)="$event.stopPropagation()"
    >
      <div class="dialog-header">
        <h3 id="confirm-dlg-title" class="dialog-title">{{ title() }}</h3>
        <button type="button" class="dialog-close-btn" aria-label="Close" (click)="cancel.emit()">✕</button>
      </div>

      <div class="dialog-body" style="display: flex; gap: 14px; align-items: flex-start; padding-block: 18px;">
        <div
          class="confirm-icon-wrap"
          [ngClass]="variant() === 'danger' ? 'confirm-icon-danger' : 'confirm-icon-primary'"
          aria-hidden="true"
        >
          @if (variant() === 'danger') {
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          } @else {
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          }
        </div>
        <p id="confirm-dlg-desc" style="margin: 0; font-size: 0.9rem; line-height: 1.5; color: var(--text-main);">
          {{ message() }}
        </p>
      </div>

      <div class="dialog-footer">
        <button type="button" class="btn-secondary" (click)="cancel.emit()">{{ cancelText() }}</button>
        <button
          type="button"
          [class]="variant() === 'danger' ? 'btn-danger-solid' : 'btn-primary'"
          (click)="confirm.emit()"
        >
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
