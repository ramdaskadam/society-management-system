<div class="dash-card">
  <div class="dash-card-header">
    <div>
      <h3 class="dash-card-title">Quick Actions</h3>
      <p class="dash-card-subtitle">Frequent administrative tasks</p>
    </div>
  </div>

  <div class="quick-actions-grid">
    <button class="quick-action-btn" (click)="addMember.emit()">
      <span class="quick-action-icon" style="background: #eff6ff; color: #2563eb;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
      </span>
      Add New Member
    </button>

    <button class="quick-action-btn" (click)="addUnit.emit()">
      <span class="quick-action-icon" style="background: #ecfdf5; color: #059669;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="9" y1="22" x2="9" y2="2"/></svg>
      </span>
      Add New Unit
    </button>

    <button class="quick-action-btn" (click)="createNotice.emit()">
      <span class="quick-action-icon" style="background: #fffbeb; color: #d97706;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </span>
      Create Notice
    </button>

    <button class="quick-action-btn" (click)="bulkInvoice.emit()">
      <span class="quick-action-icon" style="background: #fef2f2; color: #dc2626;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
      </span>
      Raise Bulk Invoice
    </button>

    <button class="quick-action-btn" (click)="generateReport.emit()">
      <span class="quick-action-icon" style="background: #f5f3ff; color: #7c3aed;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </span>
      Generate Report
    </button>

    <button class="quick-action-btn" (click)="importPayments.emit()">
      <span class="quick-action-icon" style="background: #ecfeff; color: #0891b2;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
      </span>
      Import Payments
    </button>
  </div>
</div>
