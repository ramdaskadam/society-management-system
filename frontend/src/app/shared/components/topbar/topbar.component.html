<header class="topbar">
  <div class="topbar-left">
    <div class="search-box">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        [(ngModel)]="query"
        (ngModelChange)="onSearchChange($event)"
        [placeholder]="'topbar.searchPlaceholder' | t"
        autocomplete="off"
      />
    </div>
  </div>

  <div class="topbar-right">
    <!-- Language Selector Dropdown in Topbar -->
    <div class="date-filter-pill" style="padding: 4px 10px;">
      <span style="font-size: 0.85rem;">🌐</span>
      <select
        aria-label="Select interface language"
        style="border: none; background: transparent; font-size: 0.8rem; font-weight: 600; color: var(--text-main); cursor: pointer;"
        [ngModel]="i18n.currentLang()"
        (ngModelChange)="onLangChange($event)"
      >
        @for (loc of i18n.availableLocales; track loc.code) {
          <option [value]="loc.code">{{ loc.nativeLabel }} ({{ loc.label }})</option>
        }
      </select>
    </div>

    <div class="date-filter-pill" title="Filter by date period">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span>01 May 2024 - 31 May 2024</span>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" (click)="openNotifications.emit()" [title]="'topbar.notifications' | t">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        @if (unreadNotificationsCount > 0) {
          <span class="icon-badge">{{ unreadNotificationsCount }}</span>
        }
      </button>
    </div>

    <div class="user-profile-btn">
      <img class="user-profile-avatar" [src]="user.avatar" [alt]="user.name" />
      <div class="user-profile-text">
        <div class="user-name">{{ user.name }}</div>
        <div class="user-tag">{{ role === 'admin' ? user.role : ('sidebar.flat' | t) + ' ' + user.unit }}</div>
      </div>
    </div>
  </div>
</header>
