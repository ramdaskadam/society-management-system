@if (showShell()) {
<!-- Top Role Switcher Floating Banner -->
<app-role-banner
  [currentRole]="state.currentUserRole()"
  [isTenantSession]="state.isTenantSession()"
  [societyName]="state.society().name"
  [adminLabel]="state.adminUser().name"
  [memberLabel]="state.memberUser().name + ' (' + state.currentResidentUnit() + ')'"
  (roleChange)="onRoleChange($event)"
  (tenantPortalSelect)="onTenantPortalSelect()"
  (resetDemo)="onResetDemo()"
/>

<div class="app-container">
  <!-- Mobile Sidebar Backdrop -->
  @if (mobileMenuOpen()) {
    <div
      class="mobile-sidebar-backdrop"
      (click)="closeMobileMenu()"
      aria-hidden="true"
    ></div>
  }

  <!-- Sidebar Navigation Component -->
  <app-sidebar-nav
    [role]="state.currentUserRole()"
    [currentView]="state.currentView()"
    [openComplaintsCount]="openComplaintsCount"
    [user]="state.activeUser()"
    [societyName]="state.society().name"
    [mobileOpen]="mobileMenuOpen()"
    (navSelect)="onNavSelect($event)"
    (closeMobile)="closeMobileMenu()"
  />

  <!-- Main Content Area -->
  <main class="main-wrapper">
    <!-- Topbar Component -->
    <app-topbar
      [user]="state.activeUser()"
      [role]="state.currentUserRole()"
      [unreadNotificationsCount]="state.unreadNotificationsCount()"
      (openNotifications)="dialogs.openNotificationsModal()"
      (search)="onGlobalSearch($event)"
      (toggleMobileMenu)="toggleMobileMenu()"
    />

    <!-- Lazy-Loaded Route Outlet -->
    <section class="content-area">
      <router-outlet />
    </section>
  </main>
</div>

<!-- Mobile Bottom Navigation Bar -->
<nav class="mobile-bottom-nav" aria-label="Primary mobile navigation">
  <button
    type="button"
    class="mobile-bottom-nav-item"
    [class.active]="state.currentView() === 'dashboard'"
    (click)="onNavSelect('dashboard')"
  >
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    <span>{{ 'nav.dashboard' | t }}</span>
  </button>

  <button
    type="button"
    class="mobile-bottom-nav-item"
    [class.active]="state.currentView() === 'payments' || state.currentView() === 'maintenance'"
    (click)="onNavSelect('payments')"
  >
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
    <span>{{ 'nav.payments' | t }}</span>
  </button>

  <button
    type="button"
    class="mobile-bottom-nav-item"
    [class.active]="state.currentView() === 'visitors'"
    (click)="onNavSelect('visitors')"
  >
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <span>{{ 'nav.visitors' | t }}</span>
  </button>

  <button
    type="button"
    class="mobile-bottom-nav-item"
    [class.active]="state.currentView() === 'complaints'"
    (click)="onNavSelect('complaints')"
  >
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>{{ 'nav.complaints' | t }}</span>
  </button>

  <button
    type="button"
    class="mobile-bottom-nav-item"
    [class.active]="mobileMenuOpen()"
    (click)="toggleMobileMenu()"
  >
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    <span>Menu</span>
  </button>
</nav>
} @else {
  <router-outlet />
}

<!-- ── Shared Dialogs ──────────────────────────────────────────── -->
<app-receipt-dialog
  [isOpen]="dialogs.showReceiptModal()"
  [invoice]="dialogs.activeReceiptInvoice()"
  [society]="state.society()"
  (close)="dialogs.closeReceiptModal()"
/>

<app-notifications-dialog
  [isOpen]="dialogs.showNotificationsModal()"
  [notifications]="state.notifications()"
  (close)="dialogs.closeNotificationsModal()"
  (markAllRead)="state.markNotificationsAsRead()"
/>

<!-- ── Admin Dialogs ──────────────────────────────────────────── -->
<app-create-notice-dialog
  [isOpen]="dialogs.showNoticeModal()"
  (close)="dialogs.closeNoticeModal()"
  (submit)="onPublishNotice($event)"
/>

<app-add-member-dialog
  [isOpen]="dialogs.showAddMemberModal()"
  (close)="dialogs.closeAddMemberModal()"
  (submit)="onAddMember($event)"
/>

<app-add-unit-dialog
  [isOpen]="dialogs.showAddUnitModal()"
  [editUnit]="dialogs.activeEditUnit()"
  [owners]="state.availableOwnerNames()"
  (close)="dialogs.closeAddUnitModal()"
  (submit)="onAddUnit($event)"
/>

<app-bulk-invoice-dialog
  [isOpen]="dialogs.showBulkInvoiceModal()"
  (close)="dialogs.closeBulkInvoiceModal()"
  (confirm)="onBulkInvoiceConfirm()"
/>

<!-- ── Member Dialogs ──────────────────────────────────────────── -->
<app-pay-now-dialog
  [isOpen]="dialogs.showPayModal()"
  [invoice]="dialogs.activePayInvoice()"
  (close)="dialogs.closePayModal()"
  (paid)="onPaymentConfirmed($event)"
/>

<app-raise-complaint-dialog
  [isOpen]="dialogs.showComplaintModal()"
  (close)="dialogs.closeComplaintModal()"
  (submit)="onRaiseComplaint($event)"
/>

<app-book-amenity-dialog
  [isOpen]="dialogs.showBookingModal()"
  [selectedAmenity]="dialogs.selectedAmenityForBooking()"
  (close)="dialogs.closeBookingModal()"
  (submit)="onBookAmenity($event)"
/>

<!-- Toast Notifications Component -->
<app-toast-container [toasts]="state.toasts()" />

<app-confirm-dialog
  [isOpen]="showResetConfirm()"
  [title]="'confirm.resetDemoTitle' | t"
  [message]="'confirm.resetDemoMsg' | t"
  [confirmText]="'confirm.yesReset' | t"
  [cancelText]="'profile.cancel' | t"
  variant="danger"
  (confirm)="confirmResetDemo()"
  (cancel)="showResetConfirm.set(false)"
/>
